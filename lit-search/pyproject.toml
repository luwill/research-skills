[project]
name = "litsearch"
version = "0.1.0"
description = "Time-windowed high-recall literature retrieval with measurable saturation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "selectolax>=0.3.21",
    "openai>=2.50.0",
    "pypdf>=6.14.2",
]

[project.scripts]
lit = "litsearch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer 的参数默认值就是这么写的
# UP042: WindowStatus 刻意继承 str，以便直接 JSON 序列化
ignore = ["B008", "UP042"]
